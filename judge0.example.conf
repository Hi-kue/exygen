# Judge0 Database
POSTGRES_HOST=exygen
POSTGRES_PORT=5433
POSTGRES_DB=exygen
POSTGRES_USER=exygen
POSTGRES_PASSWORD=REPLACE_WITH_DIFFERENT_RANDOM_PASSWORD

# Judge0 Redis
REDIS_HOST=exygen-sandbox-redis
REDIS_PORT=6379
REDIS_PASSWORD=REPLACE_WITH_DIFFERENT_RANDOM_PASSWORD

# Judge0 Runtime
RAILS_ENV=production
SECRET_KEY_BASE=REPLACE_WITH_RANDOM_API_TOKEN_HEX_32

# Judge0 Worker Settings
COUNT=2
MAX_QUEUE_SIZE=100

# Judge0 Execution Restrictions
CPU_TIME_LIMIT=2
MAX_CPU_TIME_LIMIT=5
CPU_EXTRA_TIME=0.5
WALL_TIME_LIMIT=5
MAX_WALL_TIME_LIMIT=10

MEMORY_LIMIT=128000
MAX_MEMORY_LIMIT=256000

MAX_PROCESSES_AND_OR_THREADS=30
MAX_MAX_PROCESSES_AND_OR_THREADS=60

MAX_FILE_SIZE=1024
MAX_MAX_FILE_SIZE=4096

# Judge0 Security
ENABLE_NETWORK=false
ALLOW_ENABLE_NETWORK=false
ENABLE_CALLBACKS=false
ENABLE_ADDITIONAL_FILES=false
ENABLE_COMPILER_OPTIONS=false
ENABLE_COMMAND_LINE_ARGUMENTS=false

# Judge0 API Behavior
ENABLE_WAIT_RESULT=false
ENABLE_BATCHED_SUBMISSIONS=true
MAX_SUBMISSION_BATCH_SIZE=20

# Judge0 API Auth
AUTHN_HEADER=X-Auth-Token
AUTHN_TOKEN=REPLACE_WITH_RANDOM_AUTH_TOKEN_HEX_32

# Judge0 Telemetry
JUDGE0_TELEMETRY_ENABLE=false
