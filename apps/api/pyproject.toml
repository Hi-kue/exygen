[project]
name = "exygen-api"
version = "0.1.0"
description = "Exygen FastAPI backend service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "exygen-agent",
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.10.0",
]

[tool.uv.sources]
exygen-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exygen_api"]
