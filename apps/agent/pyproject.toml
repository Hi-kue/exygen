[project]
name = "exygen-agent"
version = "0.1.0"
description = "Exygen multi-agent orchestration and exam generation pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.37.0",
    "pydantic>=2.10.0",
]

[project.scripts]
exygen-agent = "exygen_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exygen_agent"]
