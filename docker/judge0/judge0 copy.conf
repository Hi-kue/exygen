################################################################################
# Judge0 v1.13.1 configuration for local development.
#
# This is a trimmed version of the official judge0.conf. Unset values fall back
# to Judge0's defaults. See:
# https://github.com/judge0/judge0/blob/v1.13.1/judge0.conf
################################################################################

# Do not send telemetry from a local instance.
JUDGE0_TELEMETRY_ENABLE=false

# Allow POST /submissions?wait=true so the agent gets the result in one call.
ENABLE_WAIT_RESULT=true

# Required for Java submissions: extra .java files are sent as a base64 ZIP.
ENABLE_ADDITIONAL_FILES=true

# Docker Desktop (Windows/macOS) runs a cgroup v2 kernel, which the isolate
# version bundled with Judge0 v1.13.1 cannot use. Enabling per-process limits
# makes the worker run isolate without cgroups and use rlimits instead.
# Remove these two lines on a Linux host with cgroup v1 if you want cgroup
# isolation.
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true

# Redis
REDIS_HOST=<HOST>
REDIS_PASSWORD=<PASSWORD>

# PostgreSQL
POSTGRES_HOST=<HOST>
POSTGRES_DB=<DB>
POSTGRES_USER=<USER>
POSTGRES_PASSWORD=<PASSWORD>

# Sandbox limits. The agent sends cpu_time_limit, wall_time_limit and
# memory_limit per submission, so these must allow the values it uses.
CPU_TIME_LIMIT=5
MAX_CPU_TIME_LIMIT=15
WALL_TIME_LIMIT=10
MAX_WALL_TIME_LIMIT=20
MEMORY_LIMIT=6291456
MAX_MEMORY_LIMIT=6291456

# Maximum total size (KB) of files extracted from additional_files.
MAX_EXTRACT_SIZE=10240

# Authentication is disabled for a localhost-only instance. To require the
# X-Auth-Token header, set AUTHN_TOKEN here and JUDGE0_AUTH_TOKEN in
# apps/agent/.env to the same value.
AUTHN_TOKEN=
