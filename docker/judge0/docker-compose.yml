# Judge0 self-hosted stack for local development.
#
# Based on the official Judge0 v1.13.1 docker-compose.yml:
# https://github.com/judge0/judge0/blob/v1.13.1/docker-compose.yml
#
# Judge0 runs submissions inside isolate, so the server and worker containers
# need `privileged: true`. This setup is for local development only.
name: judge0

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:
  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    <<: *default-logging
    restart: unless-stopped

  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    <<: *default-logging
    restart: unless-stopped

  db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - data:/var/lib/postgresql/data/
    <<: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7.2.4
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: judge0.conf
    <<: *default-logging
    restart: unless-stopped

volumes:
  data:
